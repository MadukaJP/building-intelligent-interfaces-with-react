<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Card</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .movie-card .title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .movie-card .genre-year {
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Movies</h1>
    <div class="cards">
      <div class="card movie-card">
        <div class="title">The Dark Knight</div>
        <div class="genre-year">Action • 2008</div>
      </div>
    </div>
  </div>
</body>
</html>
