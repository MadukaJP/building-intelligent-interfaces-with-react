<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Card</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .job-card .title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .job-card .company {
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Jobs</h1>
    <div class="cards">
      <div class="card job-card">
        <div class="title">Frontend Developer</div>
        <div class="company">TechNova</div>
      </div>
    </div>
  </div>
</body>
</html>
