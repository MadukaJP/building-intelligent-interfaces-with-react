<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Card</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .student-card .name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .student-card .course {
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Students</h1>
    <div class="cards">
      <div class="card student-card">
        <div class="name">John Doe</div>
        <div class="course">Computer Science</div>
      </div>
    </div>
  </div>
</body>
</html>
