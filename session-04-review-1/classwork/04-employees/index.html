<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Card</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .employee-card .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #3498db;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .employee-card .name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Employees</h1>
    <div class="cards">
      <div class="card employee-card">
        <div class="avatar">AJ</div>
        <div class="name">Alex Johnson</div>
      </div>
    </div>
  </div>
</body>
</html>
