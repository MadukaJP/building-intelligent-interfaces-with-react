<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Post Card</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .post-card .username {
      font-weight: bold;
      color: #1da1f2;
    }

    .post-card .content {
      margin-top: 15px;
      color: #333;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Social Posts</h1>
    <div class="cards">
      <div class="card post-card">
        <div class="username">@john_dev</div>
        <div class="content">Just built my first React application!</div>
      </div>
    </div>
  </div>
</body>
</html>
