<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Card</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .course-card .title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .course-card .instructor {
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Courses</h1>
    <div class="cards">
      <div class="card course-card">
        <div class="title">React for Beginners</div>
        <div class="instructor">By Sarah Johnson</div>
      </div>
    </div>
  </div>
</body>
</html>
