<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .product-card .name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .product-card .price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2c3e50;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Products</h1>
    <div class="cards">
      <div class="card product-card">
        <div class="name">MacBook Air</div>
        <div class="price">₦1,200,000</div>
      </div>
    </div>
  </div>
</body>
</html>
