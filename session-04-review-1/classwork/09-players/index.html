<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Card</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .player-card .name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .player-card .club {
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Football Players</h1>
    <div class="cards">
      <div class="card player-card">
        <div class="name">Kylian Mbappé</div>
        <div class="club">Real Madrid</div>
      </div>
    </div>
  </div>
</body>
</html>
