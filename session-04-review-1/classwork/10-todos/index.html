<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Card</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .todo-card {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .todo-card .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #3498db;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .todo-card .title {
      font-size: 1rem;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todos</h1>
    <div class="cards">
      <div class="card todo-card">
        <div class="checkbox"></div>
        <div class="title">Learn JSX</div>
      </div>
    </div>
  </div>
</body>
</html>
